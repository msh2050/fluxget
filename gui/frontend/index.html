<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FluxGet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ─── Reset ─────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button{font:inherit;cursor:pointer;border:none;background:none}
input,select{font:inherit;outline:none}

/* ─── Design tokens ──────────────────────────────────────── */
:root{
  --bg:#0B0B0C;
  --surface:#131316;
  --surface-2:#18181c;
  --surface-3:#1f1f24;
  --surface-hi:#25252c;
  --border:#25252b;
  --border-soft:#1e1e23;
  --border-hi:#34343c;
  --text:#f4f4f6;
  --text-2:#c4c4cc;
  --muted:#7a7a85;
  --dim:#4d4d56;
  --accent:#00E5C8;
  --accent-2:#00b89e;
  --accent-dim:rgba(0,229,200,.10);
  --accent-line:rgba(0,229,200,.35);
  --queued:#f5b340;
  --paused:#7a7a85;
  --error:#ff5c5c;
  --error-dim:rgba(255,92,92,.10);
  --font-ui:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono','SF Mono',ui-monospace,monospace;
}

/* ─── Base ───────────────────────────────────────────────── */
html,body{height:100%;overflow:hidden}
body{
  font-family:var(--font-ui);
  font-size:13px;
  line-height:1.45;
  letter-spacing:-.005em;
  color:var(--text);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  font-feature-settings:'cv11','ss01';
  display:flex;flex-direction:column;height:100vh;
}
.mono{font-family:var(--font-mono);font-feature-settings:'zero','ss01'}

/* ─── Titlebar ───────────────────────────────────────────── */
.fg-titlebar{
  height:36px;display:flex;align-items:center;padding:0 16px;
  background:var(--surface);border-bottom:1px solid var(--border);
  flex-shrink:0;user-select:none;
}
.fg-titlebar .title{font-size:12px;color:var(--muted);letter-spacing:.01em;flex:1}
.fg-titlebar .right{
  display:flex;gap:10px;align-items:center;
  font-family:var(--font-mono);font-size:11px;color:var(--muted);
}
.fg-titlebar .right .connected{color:var(--accent)}
.fg-titlebar .right .disconnected{color:var(--error)}

/* ─── Shell ──────────────────────────────────────────────── */
.fg-shell{flex:1;display:flex;min-height:0}

/* ─── Sidebar ────────────────────────────────────────────── */
.fg-sidebar{
  width:56px;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:stretch;
  padding:12px 8px;flex-shrink:0;
}
.fg-logo{
  width:36px;height:36px;margin:0 auto 14px;
  border:1px solid var(--border-hi);border-radius:8px;
  display:grid;place-items:center;background:var(--surface-2);
  position:relative;
}
.fg-logo::before{
  content:'';position:absolute;inset:6px;
  border:1px solid var(--accent);border-radius:3px;opacity:.4;
}
.fg-logo svg{color:var(--accent);width:16px;height:16px;position:relative;z-index:1}
.fg-nav{display:flex;flex-direction:column;gap:2px}
.fg-nav-item{
  width:40px;height:40px;border:1px solid transparent;border-radius:8px;
  display:grid;place-items:center;cursor:pointer;
  color:var(--muted);background:transparent;position:relative;
  transition:color .12s,background .12s,border-color .12s;
}
.fg-nav-item:hover{color:var(--text-2);background:var(--surface-2)}
.fg-nav-item.active{color:var(--accent);background:var(--accent-dim);border-color:var(--accent-line)}
.fg-nav-item .badge{
  position:absolute;top:4px;right:4px;
  background:var(--accent);color:#000;
  font-family:var(--font-mono);font-size:9px;font-weight:700;
  padding:1px 4px;border-radius:999px;line-height:1;
}
.fg-nav-spacer{flex:1}

/* ─── Main ───────────────────────────────────────────────── */
.fg-main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg);overflow:hidden}

/* ─── Header bar ─────────────────────────────────────────── */
.fg-header{
  display:flex;align-items:center;padding:14px 20px;gap:12px;
  border-bottom:1px solid var(--border-soft);flex-shrink:0;
}
.fg-header h1{font-size:15px;font-weight:600;letter-spacing:-.01em}
.fg-header h1 small{
  color:var(--muted);font-weight:400;margin-left:8px;
  font-family:var(--font-mono);font-size:11px;
}
.fg-header .spacer{flex:1}

/* ─── Content ────────────────────────────────────────────── */
.fg-content{flex:1;overflow:hidden auto;padding:20px}

/* ─── Buttons ────────────────────────────────────────────── */
.fg-btn{
  display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;
  border:1px solid var(--border);border-radius:6px;background:var(--surface-2);
  color:var(--text-2);font-size:12px;font-weight:500;cursor:pointer;
  transition:background .12s,color .12s,border-color .12s;white-space:nowrap;
}
.fg-btn:hover{background:var(--surface-3);color:var(--text);border-color:var(--border-hi)}
.fg-btn.primary{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600}
.fg-btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.fg-btn.ghost{background:transparent;border-color:var(--border)}
.fg-btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.fg-btn.danger{color:var(--error)}
.fg-btn.danger:hover{background:var(--error-dim);border-color:rgba(255,92,92,.3);color:var(--error)}
.fg-btn .kbd{
  font-family:var(--font-mono);font-size:10px;color:var(--muted);
  margin-left:4px;padding:1px 4px;border:1px solid var(--border-hi);
  border-radius:3px;background:var(--bg);
}
.fg-btn.icon{width:30px;height:30px;padding:0;justify-content:center}

/* ─── Toggle ─────────────────────────────────────────────── */
.fg-toggle{
  display:inline-flex;align-items:center;gap:8px;height:30px;
  padding:0 10px 0 12px;border:1px solid var(--border);border-radius:6px;
  background:var(--surface-2);color:var(--text-2);font-size:12px;
  cursor:pointer;user-select:none;transition:color .12s;
}
.fg-toggle .switch{
  width:22px;height:12px;border:1px solid var(--border-hi);
  border-radius:999px;position:relative;background:var(--bg);
  transition:border-color .15s,background .15s;
}
.fg-toggle .switch::after{
  content:'';position:absolute;top:1px;left:1px;
  width:8px;height:8px;border-radius:50%;background:var(--muted);
  transition:left .15s,background .15s;
}
.fg-toggle.on .switch{border-color:var(--accent-line);background:var(--accent-dim)}
.fg-toggle.on .switch::after{left:11px;background:var(--accent)}
.fg-toggle.on{color:var(--text)}

/* ─── Cards / Bento ──────────────────────────────────────── */
.fg-bento{
  display:grid;grid-template-columns:repeat(12,1fr);
  gap:14px;align-content:start;
}
.fg-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:16px;display:flex;flex-direction:column;min-width:0;
}
.fg-card-h{
  display:flex;align-items:center;margin-bottom:12px;gap:10px;
}
.fg-card-h h3{
  font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:.08em;color:var(--muted);
}
.fg-card-h .spacer{flex:1}

/* ─── Stat block ─────────────────────────────────────────── */
.fg-stat .val{
  font-family:var(--font-mono);font-size:28px;font-weight:500;
  letter-spacing:-.02em;color:var(--text);line-height:1.1;
  display:flex;align-items:baseline;gap:5px;
}
.fg-stat .unit{font-size:13px;color:var(--muted);font-weight:400}
.fg-stat .sub{
  margin-top:6px;font-family:var(--font-mono);font-size:11px;
  color:var(--muted);display:flex;align-items:center;gap:4px;
}
.fg-stat .sub.up{color:var(--accent)}

/* ─── KPI tile ───────────────────────────────────────────── */
.fg-kpi{display:grid;gap:4px}
.fg-kpi .num{
  font-family:var(--font-mono);font-size:22px;font-weight:500;
  letter-spacing:-.02em;color:var(--text);line-height:1.1;
}
.fg-kpi .num .unit{color:var(--muted);font-size:12px;font-weight:400;margin-left:3px}
.fg-kpi .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.fg-kpi.accent .num{color:var(--accent)}

/* ─── Status pill ────────────────────────────────────────── */
.pill{
  display:inline-flex;align-items:center;gap:5px;
  font-family:var(--font-mono);font-size:10px;font-weight:600;
  text-transform:uppercase;letter-spacing:.06em;
  padding:2px 7px;border:1px solid var(--border-hi);
  border-radius:4px;color:var(--text-2);background:var(--surface-2);white-space:nowrap;
}
.pill.live{color:var(--accent);border-color:var(--accent-line);background:var(--accent-dim)}
.pill.queued{color:var(--queued);border-color:rgba(245,179,64,.3);background:rgba(245,179,64,.08)}
.pill.paused{color:var(--muted);border-color:var(--border-hi);background:var(--surface-2)}
.pill.done{color:var(--text-2);border-color:var(--border-hi);background:var(--surface-2)}
.pill.error{color:var(--error);border-color:rgba(255,92,92,.3);background:var(--error-dim)}
.pill .pulse{
  width:5px;height:5px;border-radius:50%;background:currentColor;
  animation:fg-pulse 1.4s ease-in-out infinite;
}
@keyframes fg-pulse{0%,100%{opacity:.35}50%{opacity:1}}

/* ─── Download row ───────────────────────────────────────── */
.fg-dl{
  border-top:1px solid var(--border-soft);padding:12px 0;
  display:grid;grid-template-columns:24px minmax(0,1fr) auto;
  grid-template-rows:auto auto auto;column-gap:12px;row-gap:6px;align-items:center;
}
.fg-dl:first-child{border-top:0;padding-top:4px}
.fg-dl:last-child{padding-bottom:4px}
.fg-dl .ft{
  grid-row:1/span 2;width:24px;height:28px;
  border:1px solid var(--border-hi);border-radius:4px;
  font-family:var(--font-mono);font-size:8px;font-weight:600;color:var(--text-2);
  display:grid;place-items:center;letter-spacing:.04em;background:var(--surface-2);
}
.fg-dl .name{
  font-size:13px;font-weight:500;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.fg-dl .meta{
  grid-column:2;font-family:var(--font-mono);font-size:11px;
  color:var(--muted);display:flex;gap:8px;align-items:center;
  white-space:nowrap;overflow:hidden;
}
.fg-dl .meta .mdot{width:3px;height:3px;border-radius:50%;background:var(--dim);flex-shrink:0}
.fg-dl .meta .speed{color:var(--accent)}
.fg-dl .acts{grid-row:1/span 2;display:flex;gap:4px;align-items:center}
.fg-dl .bar{
  grid-column:1/-1;height:2px;background:var(--surface-3);
  border-radius:1px;overflow:hidden;
}
.fg-dl .bar i{
  display:block;height:100%;background:var(--accent);border-radius:1px;
  transition:width .3s ease;
}
.fg-dl.paused .bar i{background:var(--muted)}
.fg-dl.queued .bar i{background:var(--queued);width:0!important}
.fg-dl.error .bar i{background:var(--error)}
.fg-dl.done .bar i{background:var(--text-2);width:100%!important}

/* ─── Icon button ────────────────────────────────────────── */
.iconbtn{
  width:22px;height:22px;border:1px solid var(--border);background:var(--surface-2);
  border-radius:4px;color:var(--muted);display:grid;place-items:center;cursor:pointer;
  transition:background .12s,color .12s,border-color .12s;
}
.iconbtn:hover{background:var(--surface-3);color:var(--text);border-color:var(--border-hi)}
.iconbtn.danger:hover{color:var(--error);border-color:rgba(255,92,92,.3);background:var(--error-dim)}
.iconbtn.active{color:var(--accent);border-color:var(--accent-line);background:var(--accent-dim)}
.iconbtn svg{width:11px;height:11px}

/* ─── Goroutine bar ──────────────────────────────────────── */
.gorobar{
  display:inline-flex;align-items:center;gap:2px;
  padding:2px 6px;border:1px solid var(--border-hi);border-radius:4px;
  background:var(--surface-2);font-family:var(--font-mono);font-size:10px;color:var(--muted);
}
.gorobar .segs{display:inline-flex;gap:1px;margin-right:4px}
.gorobar .seg{width:2px;height:8px;background:var(--surface-hi);border-radius:1px}
.gorobar .seg.on{background:var(--accent)}

/* ─── Speed graph ────────────────────────────────────────── */
.speedgraph{position:relative;width:100%;flex:1;min-height:110px}
.speedgraph svg{width:100%;height:100%;display:block}

/* ─── Connection heatmap ─────────────────────────────────── */
.heat-strip{display:grid;gap:1px;height:18px}

/* ─── Tabs ───────────────────────────────────────────────── */
.fg-tabs{display:flex;gap:0}
.fg-tab{
  padding:8px 14px;font-size:12px;color:var(--muted);cursor:pointer;
  border-bottom:1px solid transparent;margin-bottom:-1px;font-weight:500;
  transition:color .12s;
}
.fg-tab:hover{color:var(--text-2)}
.fg-tab.active{color:var(--text);border-bottom-color:var(--accent)}
.fg-tab .count{font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-left:6px}

/* ─── Clipboard catcher ──────────────────────────────────── */
.fg-clipcatch{
  display:flex;align-items:center;gap:10px;padding:6px 8px 6px 14px;
  border:1px solid var(--accent-line);background:var(--accent-dim);
  border-radius:8px;color:var(--text);font-size:12px;height:36px;
  transform:translateX(0);opacity:1;transition:transform .2s ease-out,opacity .2s ease-out;
}
.fg-clipcatch.hidden{transform:translateX(20px);opacity:0;pointer-events:none}
.fg-clipcatch .label{color:var(--text);font-weight:500}
.fg-clipcatch .url{
  font-family:var(--font-mono);font-size:11px;color:var(--text-2);
  max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* ─── Speed limiter chip ─────────────────────────────────── */
.fg-chip{
  display:inline-flex;align-items:center;gap:8px;padding:0 12px;height:30px;
  border:1px solid var(--border);border-radius:6px;
  font-family:var(--font-mono);font-size:11px;color:var(--text-2);background:var(--surface-2);
}
.fg-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.fg-chip .label{color:var(--muted)}

/* ─── Settings ───────────────────────────────────────────── */
.fg-settings{display:grid;gap:18px;max-width:760px}
.fg-set-section{border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.fg-set-section>h3{
  padding:14px 18px;border-bottom:1px solid var(--border);
  font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:.08em;color:var(--muted);
}
.fg-set-row{
  padding:14px 18px;display:grid;grid-template-columns:1fr auto;
  gap:16px;align-items:center;border-top:1px solid var(--border-soft);
}
.fg-set-row:nth-child(2){border-top:0}
.fg-set-row .label{font-size:13px;color:var(--text);font-weight:500}
.fg-set-row .desc{font-size:12px;color:var(--muted);margin-top:2px}
.fg-input{
  background:var(--surface-2);border:1px solid var(--border);border-radius:6px;
  color:var(--text);padding:6px 10px;font:12px var(--font-mono);
  width:200px;transition:border-color .12s;
}
.fg-input:focus{border-color:var(--accent-line)}
.fg-select{
  background:var(--surface-2);border:1px solid var(--border);border-radius:6px;
  color:var(--text);padding:6px 10px;font:12px var(--font-ui);
  cursor:pointer;min-width:140px;
}

/* ─── Empty state ────────────────────────────────────────── */
.fg-empty{flex:1;display:grid;place-items:center;text-align:center;padding:40px}
.fg-empty .glyph{
  width:64px;height:64px;border:1px solid var(--border-hi);border-radius:12px;
  margin:0 auto 20px;display:grid;place-items:center;color:var(--muted);background:var(--surface);
}
.fg-empty h2{font-size:18px;font-weight:600;letter-spacing:-.01em;margin-bottom:6px}
.fg-empty p{color:var(--muted);font-size:13px;max-width:380px;margin:0 auto 24px;line-height:1.55}
.fg-empty .actions{display:flex;gap:10px;justify-content:center;margin-bottom:16px}
.fg-empty .clipboard-card{
  display:inline-flex;align-items:center;gap:10px;padding:10px 14px;
  border:1px dashed var(--border-hi);border-radius:8px;background:var(--surface);
  font-family:var(--font-mono);font-size:11px;color:var(--muted);
}

/* ─── Torrent piece map ──────────────────────────────────── */
.piece-map{display:grid;grid-template-columns:repeat(96,1fr);gap:1px}
.piece-map i{height:10px;display:block;background:var(--surface-3)}
.piece-map i.done{background:var(--accent)}
.piece-map i.done2{background:var(--accent-2)}
.piece-map i.inflight{background:rgba(0,229,200,.5)}

/* ─── Completed table ────────────────────────────────────── */
.completed-table{border:1px solid var(--border);border-radius:10px;background:var(--surface);overflow:hidden}
.completed-table .trow{
  display:grid;grid-template-columns:32px 1fr 110px 100px 100px 130px 100px;
  gap:12px;padding:12px 16px;align-items:center;
}
.completed-table .thead{
  border-bottom:1px solid var(--border);
  font-family:var(--font-mono);font-size:10px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.08em;font-weight:600;
}
.completed-table .trow+.trow{border-top:1px solid var(--border-soft)}

/* ─── Scrollbar ──────────────────────────────────────────── */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface-hi);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--border-hi)}
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════
     APP SHELL
══════════════════════════════════════════════════════════ -->
<div class="fg-titlebar">
  <div class="title mono" id="app-version">FluxGet · v2.1.6</div>
  <div class="right" id="titlebar-right">
    <span id="conn-status" class="disconnected">● offline</span>
    <span>:1700</span>
    <span id="cpu-stat">cpu —</span>
    <span id="mem-stat">mem —</span>
  </div>
</div>

<div class="fg-shell">
  <!-- Sidebar -->
  <aside class="fg-sidebar">
    <div class="fg-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12M7 11l5 5 5-5"/>
      </svg>
    </div>
    <nav class="fg-nav" id="nav">
      <button class="fg-nav-item active" data-view="dashboard" title="Dashboard">
        <!-- Activity icon -->
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-9 4 18 3-9h4"/></svg>
        <span class="badge" id="nav-badge-dashboard"></span>
      </button>
      <button class="fg-nav-item" data-view="completed" title="Completed">
        <!-- Check icon -->
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      </button>
      <button class="fg-nav-item" data-view="settings" title="Settings">
        <!-- Settings icon -->
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 0 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 0 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 0 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 0 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
      <div class="fg-nav-spacer"></div>
    </nav>
  </aside>

  <!-- Main content area -->
  <main class="fg-main" id="main-view"></main>
</div>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════════ */
const state = {
  view: localStorage.getItem('fg-view') || 'dashboard',
  connected: false,

/* ═══════════════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════════════ */
function fmtBytes(b) {
  if (!b) return '0 B';
  if (b < 1024) return b + ' B';
  if (b < 1024**2) return (b/1024).toFixed(1) + ' KB';
  if (b < 1024**3) return (b/1024**2).toFixed(1) + ' MB';
  return (b/1024**3).toFixed(2) + ' GB';
}
function fmtSpeed(bps) {
  if (!bps) return '0 B/s';
  if (bps < 1024) return bps.toFixed(0) + ' B/s';
  if (bps < 1024**2) return (bps/1024).toFixed(1) + ' KB/s';
  return (bps/1024**2).toFixed(1) + ' MB/s';
}
function fmtETA(sec) {
  if (!sec || sec <= 0) return '—';
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  if (m >= 60) return Math.floor(m/60) + ':' + String(Math.floor(m%60)).padStart(2,'0') + 'h';
  return m + ':' + String(s).padStart(2,'0');
}
function fmtDur(ns) {
  const s = Math.round(ns / 1e9);
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function extOf(filename) {
  const m = filename.match(/\.([^.]+)$/);
  return m ? m[1].toUpperCase().slice(0,3) : 'BIN';
}
function hostOf(url) {
  try { return new URL(url).hostname.replace('www.',''); } catch { return url; }
}
function html(strings, ...vals) {
  return strings.reduce((acc, s, i) => acc + s + (vals[i] != null ? String(vals[i]) : ''), '');
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ═══════════════════════════════════════════════════════════
   COMPONENTS
═══════════════════════════════════════════════════════════ */
function pillHtml(status) {
  const map = {
    downloading: `<span class="pill live"><span class="pulse"></span>Live</span>`,
    queued:      `<span class="pill queued">Queued</span>`,
    paused:      `<span class="pill paused">Paused</span>`,
    done:        `<span class="pill done">Done</span>`,
    error:       `<span class="pill error">Error</span>`,
    seeding:     `<span class="pill done">Seeding</span>`,
  };
  return map[status] || `<span class="pill">${esc(status)}</span>`;
}

function goroHtml(active, max) {
  const ratio = max ? active / max : 0;
  let segs = '';
  for (let i = 0; i < 16; i++) {
    segs += `<span class="seg${i/16 < ratio ? ' on' : ''}"></span>`;
  }
  return `<span class="gorobar"><span class="segs">${segs}</span><span>g·${String(active).padStart(2,'0')}</span></span>`;
}

function downloadRowHtml(d) {
  const pct = d.status === 'done' ? 100 : (d.total_size ? (d.downloaded / d.total_size * 100) : 0);
  const ext = extOf(d.filename);
  const host = hostOf(d.url);
  const sid = esc(d.id);
  const showInfo = state.infoId === d.id;

  let meta = '';
  if (d.status === 'downloading') {
    meta += `<span class="speed">↓ ${fmtSpeed(d.speed)}</span>`;
    // Size: "downloaded / total" when total is known, else just "downloaded"
    // (some streams have no known length — mirrors IDM's unknown-size behaviour).
    const sizeTxt = d.total_size
      ? `${fmtBytes(d.downloaded || 0)} / ${fmtBytes(d.total_size)}`
      : `${fmtBytes(d.downloaded || 0)}`;
    meta += `<span class="mdot"></span><span>${sizeTxt}</span>`;
    meta += `<span class="mdot"></span><span>ETA ${fmtETA(d.eta)}</span>`;
    meta += `<span class="mdot"></span>`;
    meta += goroHtml(d.connections || 0, state.settings.maxConns);
  } else if (d.status === 'paused') {
    meta += `<span>Paused at ${pct.toFixed(0)}% · ${fmtBytes(d.downloaded || 0)}${d.total_size ? ' / ' + fmtBytes(d.total_size) : ''}</span>`;
  } else if (d.status === 'queued') {
    meta += `<span>Waiting in queue</span>`;
  } else if (d.status === 'done') {
    meta += `<span class="speed">✓ ${fmtBytes(d.total_size)}</span>`;
    if (d.avg_speed) { meta += `<span class="mdot"></span><span>${fmtSpeed(d.avg_speed)} avg</span>`; }
    if (d.time_taken) { meta += `<span class="mdot"></span><span>${fmtDur(d.time_taken)}</span>`; }
  } else if (d.status === 'error') {
    meta += `<span style="color:var(--error)">${esc(d.error || 'Download failed')}</span>`;
  }
  meta += `<span class="mdot"></span><span style="color:var(--dim)">${esc(host)}</span>`;

  let acts = '';
  if (d.status === 'downloading') {
    acts += `<button class="iconbtn" title="Pause" onclick="apiPause('${sid}')">${ico.pause}</button>`;
  } else if (d.status === 'paused' || d.status === 'queued') {
    acts += `<button class="iconbtn" title="Resume" onclick="apiResume('${sid}')">${ico.play}</button>`;
  } else if (d.status === 'error') {
    acts += `<button class="iconbtn" title="Retry" onclick="apiRetry('${sid}')">${ico.refresh}</button>`;
  } else if (d.status === 'done') {
    acts += `<button class="iconbtn" title="Open file" onclick="apiOpenFile('${sid}')">${ico.file}</button>`;
    acts += `<button class="iconbtn" title="Open folder" onclick="apiOpenFolder('${sid}')">${ico.folder}</button>`;
  }
  acts += `<button class="iconbtn${showInfo?' active':''}" title="Info / source URL" onclick="toggleInfo('${sid}')">${ico.info}</button>`;
  acts += `<button class="iconbtn danger" title="Remove" onclick="apiDelete('${sid}')">${ico.x}</button>`;

  const infoPanel = showInfo ? `
<div style="grid-column:1/-1;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:5px;margin-top:2px">
  <div style="display:flex;gap:10px;align-items:baseline;min-width:0">
    <span style="font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;flex-shrink:0;width:32px">URL</span>
    <span class="mono" style="font-size:11px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(d.url)}">${esc(d.url||'—')}</span>
  </div>
  <div style="display:flex;gap:10px;align-items:baseline;min-width:0">
    <span style="font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;flex-shrink:0;width:32px">PATH</span>
    <span class="mono" style="font-size:11px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(d.dest_path)}">${esc(d.dest_path||'—')}</span>
  </div>
  ${d.status==='error' ? `<div style="display:flex;gap:10px;align-items:baseline">
    <span style="font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;flex-shrink:0;width:32px">ERR</span>
    <span class="mono" style="font-size:11px;color:var(--error)">${esc(d.error||'Unknown error')}</span>
  </div>` : ''}
  ${d.completed_at ? `<div style="display:flex;gap:10px;align-items:baseline">
    <span style="font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;flex-shrink:0;width:32px">DONE</span>
    <span class="mono" style="font-size:11px;color:var(--text-2)">${esc(new Date(d.completed_at*1000).toLocaleString())}</span>
  </div>` : ''}
</div>` : '';

  return `
<div class="fg-dl ${esc(d.status)}" data-id="${sid}">
  <div class="ft">${esc(ext)}</div>
  <div class="name" title="${esc(d.filename)}">${esc(d.filename)}</div>
  <div style="display:flex;align-items:center;gap:10px">${pillHtml(d.status)}</div>
  <div class="meta">${meta}</div>
  <div class="acts">${acts}</div>
  <div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div>
  ${infoPanel}
</div>`;
}

/* ═══════════════════════════════════════════════════════════
   SPEED GRAPH
═══════════════════════════════════════════════════════════ */
function renderSpeedGraph(containerId) {
  const el = document.getElementById(containerId);
  if (!el) return;
  const W = 800, H = 160;
  const down = state.speedHistory.down;
  const up   = state.speedHistory.up;
  const maxVal = Math.max(...down, ...up, 1024*1024); // min 1 MB/s scale

  function pts(arr) {
    return arr.map((v,i) => {
      const x = (i / (arr.length-1)) * W;
      const y = H - (v / maxVal) * (H-14) - 6;
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
  }

  const ticks = 4;
  let gridLines = '';
  for (let i = 0; i < ticks; i++) {
    const y = (i / (ticks-1)) * (H-16) + 6;
    gridLines += `<line x1="0" y1="${y.toFixed(1)}" x2="${W}" y2="${y.toFixed(1)}" stroke="var(--border-soft)" stroke-width="1"/>`;
  }

  el.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:100%;display:block">
      <g>${gridLines}</g>
      <polyline points="${pts(up)}" fill="none" stroke="var(--text-2)" stroke-width="1.25" stroke-dasharray="3 2"/>
      <polyline points="${pts(down)}" fill="none" stroke="var(--accent)" stroke-width="1.25"/>
    </svg>`;
}

/* ═══════════════════════════════════════════════════════════
   CONNECTION HEATMAP
═══════════════════════════════════════════════════════════ */
function heatStripHtml(totalActive) {
  const COUNT = 64;
  let cells = '';
  for (let i = 0; i < COUNT; i++) {
    const active = i < totalActive;
    const r = Math.random();
    let bg;
    if (!active) bg = 'var(--surface-3)';
    else if (r > 0.7) bg = 'var(--accent)';
    else if (r > 0.4) bg = 'rgba(0,229,200,.6)';
    else bg = 'rgba(0,229,200,.25)';
    cells += `<div style="background:${bg};border-radius:1px"></div>`;
  }
  return `<div class="heat-strip" style="grid-template-columns:repeat(${COUNT},1fr)">${cells}</div>`;
}

/* ═══════════════════════════════════════════════════════════
   ROUTING
═══════════════════════════════════════════════════════════ */
function navigate(view) {
  state.view = view;
  localStorage.setItem('fg-view', view);
  document.querySelectorAll('.fg-nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.view === view);
  });
  renderView();
}

function renderView() {
  const main = document.getElementById('main-view');
  let content = '';
  switch (state.view) {
    case 'dashboard': content = renderDashboard(); break;
    case 'completed': content = renderCompleted(); break;
    case 'settings':  content = renderSettings(); break;
    default: content = renderDashboard();
  }
  main.innerHTML = content;

  if (state.view === 'dashboard') {
    renderSpeedGraph('speed-graph');
  }
}

// Throttled re-render: max 4Hz
let renderQueued = false;
function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => {
    renderQueued = false;
    const now = Date.now();
    if (now - state.lastRender >= 250) {
      state.lastRender = now;
      renderView();
    }
  });
}

   TITLEBAR
═══════════════════════════════════════════════════════════ */
async function loadVersion() {
  try {
    const r = await fetch('/health');
    const h = await r.json();
    const el = document.getElementById('app-version');
    if (el && h.version) {
      // Show short commit so every fresh build is visibly distinct.
      const commit = h.commit && h.commit !== 'unknown' ? ` (${h.commit.slice(0,7)})` : '';
      el.textContent = `FluxGet · v${h.version}${commit}`;
    }

}

function renderTitlebar() {
  const el = document.getElementById('conn-status');
  if (el) {
    el.className = state.connected ? 'connected' : 'disconnected';
    el.textContent = state.connected ? '● connected' : '● offline';
  }

  if (badge) {
    const n = Object.values(state.downloads).filter(d=>d.status==='downloading').length;
    badge.textContent = n > 0 ? String(n) : '';
    badge.style.display = n > 0 ? '' : 'none';

}

/* ═══════════════════════════════════════════════════════════
   SSE
═══════════════════════════════════════════════════════════ */
function connectSSE() {
  const es = new EventSource('/events');

  es.onopen = () => {
    state.connected = true;
    renderTitlebar();
  };
  es.onerror = () => {
    state.connected = false;
    renderTitlebar();
    setTimeout(connectSSE, 3000);
    es.close();
  };

  es.addEventListener('progress', e => {
    const d = JSON.parse(e.data);
    const dl = state.downloads[d.DownloadID];
    if (dl) {
      dl.downloaded = d.Downloaded;
      dl.total_size = d.Total || dl.total_size;
      dl.speed = d.Speed;
      dl.connections = d.ActiveConnections;
      dl.progress = dl.total_size ? dl.downloaded / dl.total_size : 0;
      dl.eta = dl.speed > 0 ? (dl.total_size - dl.downloaded) / dl.speed : 0;

      // push to speed history
      state.speedHistory.down.push(d.Speed);
      state.speedHistory.down = state.speedHistory.down.slice(-60);
      state.speedHistory.up.push(d.Speed * 0.03); // approximation
      state.speedHistory.up = state.speedHistory.up.slice(-60);
    }
    scheduleRender();
  });

  es.addEventListener('started', e => {
    const d = JSON.parse(e.data);
    state.downloads[d.DownloadID] = {
      id: d.DownloadID,
      url: d.URL,
      filename: d.Filename,
      dest_path: d.DestPath,
      total_size: d.Total,
      downloaded: 0,
      speed: 0,
      status: 'downloading',
      connections: 0,
      eta: 0,
      avg_speed: 0,
      progress: 0,
      error: '',
    };
    scheduleRender();
  });

  es.addEventListener('complete', e => {
    const d = JSON.parse(e.data);
    if (state.downloads[d.DownloadID]) {
      state.downloads[d.DownloadID].status = 'done';
      state.downloads[d.DownloadID].speed = 0;
      state.downloads[d.DownloadID].avg_speed = d.AvgSpeed;
    }
    loadHistory();
    scheduleRender();
  });

  es.addEventListener('error', e => {
    const d = JSON.parse(e.data);
    if (state.downloads[d.DownloadID]) {
      state.downloads[d.DownloadID].status = 'error';
      state.downloads[d.DownloadID].error = d.Err || 'Download failed';
    }
    scheduleRender();
  });

  es.addEventListener('paused', e => {
    const d = JSON.parse(e.data);
    if (state.downloads[d.DownloadID]) {
      state.downloads[d.DownloadID].status = 'paused';
      state.downloads[d.DownloadID].speed = 0;
    }
    scheduleRender();
  });

  es.addEventListener('resumed', e => {
    const d = JSON.parse(e.data);
    if (state.downloads[d.DownloadID]) {
      state.downloads[d.DownloadID].status = 'downloading';
    }
    scheduleRender();
  });

  es.addEventListener('queued', e => {
    const d = JSON.parse(e.data);
    state.downloads[d.DownloadID] = {
      id: d.DownloadID,
      url: d.URL,
      filename: d.Filename,
      dest_path: d.DestPath,
      total_size: 0,
      downloaded: 0,
      speed: 0,
      status: 'queued',
      connections: 0,
      eta: 0,
      avg_speed: 0,
      progress: 0,
      error: '',
    };
    scheduleRender();
  });

  es.addEventListener('removed', e => {
    const d = JSON.parse(e.data);
    delete state.downloads[d.DownloadID];
    scheduleRender();
  });
}

/* ═══════════════════════════════════════════════════════════
   API CALLS
═══════════════════════════════════════════════════════════ */
async function apiPause(id) {
  if (state.downloads[id]) state.downloads[id].status = 'paused';
  scheduleRender();
  await fetch(`/pause?id=${encodeURIComponent(id)}`, {method:'POST'});
}
async function apiResume(id) {
  if (state.downloads[id]) state.downloads[id].status = 'downloading';
  scheduleRender();
  await fetch(`/resume?id=${encodeURIComponent(id)}`, {method:'POST'});
}
async function apiDelete(id) {
  delete state.downloads[id];
  state.history = state.history.filter(h => h.id !== id);
  if (state.infoId === id) state.infoId = null;
  scheduleRender();
  await fetch(`/delete?id=${encodeURIComponent(id)}`, {method:'POST'});
}

async function apiRetry(id) {
  const d = state.downloads[id];
  if (!d || !d.url) return;
  delete state.downloads[id];
  scheduleRender();
  await fetch('/download', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({url: d.url, filename: d.filename}),
  });
}

async function apiOpenFile(id) {
  await fetch(`/open-file?id=${encodeURIComponent(id)}`, {method:'POST'});
}

async function apiOpenFolder(id) {
  await fetch(`/open-folder?id=${encodeURIComponent(id)}`, {method:'POST'});
}

function toggleInfo(id) {
  state.infoId = state.infoId === id ? null : id;
  scheduleRender();
}

async function loadList() {
  try {
    const r = await fetch('/list');
    const data = await r.json();
    const items = data.downloads || data || [];
    items.forEach(d => {
      state.downloads[d.id] = d;
    });
    scheduleRender();
  } catch(e) {}
}

async function loadHistory() {
  try {
    const r = await fetch('/history');
    const data = await r.json();
    state.history = data.downloads || data || [];
    // Reflect completed downloads into the dashboard queue
    state.history.forEach(d => {
      if (!state.downloads[d.id] || state.downloads[d.id].status === 'done') {
        state.downloads[d.id] = {
          id: d.id,
          url: d.url || '',
          filename: d.filename || '',
          dest_path: d.dest_path || '',
          total_size: d.total_size || 0,
          downloaded: d.total_size || 0,
          speed: 0,
          status: 'done',
          connections: 0,
          eta: 0,
          avg_speed: d.avg_speed || 0,
          progress: 1,
          error: '',
          completed_at: d.completed_at,
          time_taken: d.time_taken,
        };
      }
    });
    scheduleRender();
  } catch(e) {}
}

/* ═══════════════════════════════════════════════════════════
   SETTINGS ACTIONS
═══════════════════════════════════════════════════════════ */
function toggleSetting(key, el) {
  el.classList.toggle('on');
  const isOn = el.classList.contains('on');
  el.querySelector('span:first-child').textContent = isOn ? 'On' : 'Off';
  state.settings[key] = isOn;
}

async function loadSettings() {
  try {
    const r = await fetch('/settings');
    if (!r.ok) return;
    const data = await r.json();
    Object.assign(state.settings, data);
  } catch(e) {}
}

async function saveSettings() {
  const s = state.settings;
  s.dir           = document.getElementById('s-dir')?.value       || s.dir;
  s.maxConns      = parseInt(document.getElementById('s-maxconn')?.value) || s.maxConns;
  s.maxConcurrent = parseInt(document.getElementById('s-maxdl')?.value)   || s.maxConcurrent;
  s.speedLimit    = parseFloat(document.getElementById('s-limit')?.value) || 0;
  s.speedLimitUnit= document.getElementById('s-limitunit')?.value || s.speedLimitUnit;
  s.userAgent     = document.getElementById('s-ua')?.value        ?? s.userAgent;
  s.proxyUrl      = document.getElementById('s-proxy')?.value     ?? s.proxyUrl;
  s.quality       = document.getElementById('s-quality')?.value   || s.quality;
  s.muxContainer  = document.getElementById('s-mux')?.value       || s.muxContainer;
  s.hlsConns      = parseInt(document.getElementById('s-hlsconns')?.value) || s.hlsConns;
  s.ytdlpPath     = document.getElementById('s-ytdlp')?.value     || s.ytdlpPath;
  s.ytdlpQuality  = document.getElementById('s-ytquality')?.value || s.ytdlpQuality;
  s.ytdlpFormat   = document.getElementById('s-ytformat')?.value  || s.ytdlpFormat;
  s.port          = parseInt(document.getElementById('s-port')?.value) || s.port;

  try {
    const r = await fetch('/settings', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(s),
    });
    if (r.ok) {
      const msg = document.getElementById('s-msg');
      if (msg) { msg.style.display=''; setTimeout(()=>{ msg.style.display='none'; }, 2000); }
    }
  } catch(e) {}
}

async function resetSettings() {
  await loadSettings();
  renderView();
}

function filterHistory(q) {
  // client-side filter is ephemeral; history already loaded
}

async function clearHistory() {
  if (!confirm('Clear all download history?')) return;
  state.history = [];
  scheduleRender();
}

function setDashTab(tab) {
  state.dashTab = tab;
  scheduleRender();
}

function catchClipboard() {
  if (state.clipUrl) {
    fetch('/download', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({url: state.clipUrl}),
    });
    state.clipUrl = null;
    scheduleRender();
  }
}

/* ═══════════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════════ */
// Wire sidebar nav
document.getElementById('nav').addEventListener('click', e => {
  const btn = e.target.closest('[data-view]');
  if (btn) navigate(btn.dataset.view);
});

// Re-load history whenever user switches to Completed tab
document.getElementById('nav').addEventListener('click', e => {
  const btn = e.target.closest('[data-view]');
  if (btn && btn.dataset.view === 'completed') loadHistory();
  if (btn && btn.dataset.view === 'settings')  loadSettings();
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'v') {
    navigator.clipboard?.readText?.().then(text => {
      if (text && (text.startsWith('http://') || text.startsWith('https://'))) {
        state.clipUrl = text;
        scheduleRender();
      }
    }).catch(() => {});
  }
});

// Initial render
navigate(state.view);
renderTitlebar();

// Load current state
loadVersion();
loadList();
loadHistory();
loadSettings();

// Start SSE
connectSSE();
</script>
